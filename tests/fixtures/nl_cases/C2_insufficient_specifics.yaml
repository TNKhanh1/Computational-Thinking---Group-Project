# Category C2 — Insufficient Specifics About the Work (18 cases, 15% of dataset)
# Prompts that pass basic temporal/duration syntax but lack concrete specifics on what work to perform.
# Reference clock: 2026-11-06T09:00 (Friday)

cases:
- id: C2-01
  domain: office
  group: C2.1 Unresolved pronouns & references
  covers:
  - dangling_pronoun_it
  - vague_task
  input:
    prompt: Finish it by tomorrow at 18:00, takes 60 minutes.
    ui:
      session: splittable
      pacing: BALANCED
      priority: 2
      attachments: []
  expected:
    status: OK_WITH_WARNINGS
    title: Finish unspecified task ("it")
    total_work_minutes: 60
    deadline: 2026-11-07T18:00
    priority: 2
    is_task_splittable: true
    splitting:
      min: 15
      pref: 45
      max: 60
    warnings:
    - W_UNRESOLVED_REFERENCE
    - W_VAGUE_TASK
    suggestions:
    - Replace 'it' with the specific deliverable name (e.g., 'Finish Q4 budget spreadsheet').
  rationale: Temporal and duration syntax are clear (60m, tomorrow 18:00), but 'it' is an unresolved pronoun.
