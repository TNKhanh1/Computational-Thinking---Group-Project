# Category C1 — Contradictions (12 cases, 10% of dataset)
# Tasks that pass basic entity recognition but contain logical, temporal, or numerical contradictions.
# Reference clock: 2026-11-06T09:00 (Friday)

cases:
- id: C1-01
  domain: office
  group: C1.1 Duration & arithmetic contradictions
  covers:
  - total_vs_subtask_sum_mismatch
  - duration_contradiction
  input:
    prompt: 'Prepare the quarterly investor update in 60 minutes total by Tuesday at 17:00: first gather revenue
      metrics for 45m, then draft narrative slides for 45m, finally rehearse pitch delivery for 30m.

      '
    ui:
      session: splittable
      pacing: BALANCED
      priority: 1
      attachments: []
  expected:
    status: NEEDS_FIX
    title: Prepare quarterly investor update
    total_work_minutes: 60
    deadline: 2026-11-10T17:00
    priority: 1
    is_task_splittable: true
    splitting:
      min: 15
      pref: 45
      max: 60
    subtasks:
    - id: s1
      title: Gather revenue metrics
      status: TODO
      minutes: 45
      priority: 1
      depends_on: []
    - id: s2
      title: Draft narrative slides
      status: TODO
      minutes: 45
      priority: 1
      depends_on:
      - s1
    - id: s3
      title: Rehearse pitch delivery
      status: TODO
      minutes: 30
      priority: 1
      depends_on:
      - s2
    errors:
    - E_DURATION_CONTRADICTION
    suggestions:
    - 'First-layer verification: Header token specifies ''60 minutes total'', but declared subtasks sum to 120 minutes
      (45 + 45 + 30). Flagged for user correction or Engine Solver resolution.'
  rationale: Parser preserves the parsed header token (60m) and subtask tokens (45+45+30=120m) without overwriting,
    flagging E_DURATION_CONTRADICTION for downstream resolution.
